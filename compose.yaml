services:
  thinklab:
    build: .
    ports:
      - "${THINKLAB_BIND:-127.0.0.1}:${THINKLAB_PORT:-8791}:8791"
    environment:
      LEARNING_HOST: 0.0.0.0
      LEARNING_PORT: "8791"
      LEARNING_DB: /state/learning.sqlite3
      LEARNING_PUBLIC_HOST: "${THINKLAB_BIND:-127.0.0.1}"
      LEARNING_PUBLIC_PORT: "${THINKLAB_PORT:-8791}"
      LEARNING_CONTENT_IMPORT: "0"
    volumes:
      - thinklab-data:/state
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  thinklab-data:
